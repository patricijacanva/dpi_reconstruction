;</script><script>const euro = new Intl.NumberFormat('en-IE',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const money = n => `${n < 0 ? '(' : ''}${euro.format(Math.abs(n))}${n < 0 ? ')' : ''}`;
const rowTable = rows => `<table><tbody>${rows.map(r=>`<tr><td>${r.label}</td><td class="money">${money(r.value)}</td><td class="muted">${r.detail||''}</td></tr>`).join('')}</tbody></table>`;
const statement = (title, rows) => `<details class="statement"><summary>${title}</summary>${rowTable(rows)}</details>`;
const tag = (label, cls='')=>`<span class="badge ${cls}">${label}</span>`;
const effects = e => Object.entries(e).filter(([,v])=>v!==0&&v!==null).map(([k,v])=>`<span>${k}: ${v>0?'+':''}${money(v)}</span>`).join('') || '<span>No incremental effect</span>';

function dashboard(d){
 const pl=d.statements.profitAndLoss, bs=d.statements.balanceSheet, cf=d.statements.cashFlow;
 return `<section class="grid metrics"><div class="metric"><small>Net profit · YTD</small><strong>${money(63000)}</strong><span class="green">Reconstructed</span></div><div class="metric"><small>Cash at bank</small><strong>${money(60000)}</strong><span class="green">Bank confirmed</span></div><div class="metric"><small>Net assets</small><strong>${money(123000)}</strong><span class="green">Balanced</span></div><div class="metric"><small>Material judgments</small><strong>25</strong><span class="amber">3 evidence limitations</span></div></section>
 <section class="grid two"><article class="card"><h2>Executive summary</h2><p>Bad Decisions Capital acquired Divorce Party International after management records overstated income and suppressed adjustments. The certified base case reports <strong>${money(63000)} net profit</strong>, not management’s claimed result.</p><div class="callout"><strong>Board recommendation:</strong> ${d.boardRecommendation.summary}</div><h3 style="margin-top:18px">Immediate actions</h3><ul>${d.boardRecommendation.actions.map(x=>`<li>${x}</li>`).join('')}</ul></article><article class="card"><h2>Financial crime scene</h2><table><tbody><tr><td>September deposits booked as sales</td><td class="money red">${money(90000)}</td></tr><tr><td>Loan labelled income</td><td class="money red">${money(50000)}</td></tr><tr><td>Founder cash extracted</td><td class="money red">${money(110000)}</td></tr><tr><td>Unresolved inventory difference</td><td class="money amber">${money(9000)}</td></tr><tr><td>Supplier-payment evidence gap</td><td class="money amber">${money(45000)}</td></tr></tbody></table></article></section>
 <section class="section"><h2>Three primary statements</h2>${statement('Profit and loss · 1 January - 31 August 2026',pl)}${statement('Cash flow statement · direct method', [...cf.operating,...cf.investing,...cf.financing,['Net change in cash',cf.netChange,''],['Opening cash',cf.openingCash,''],['Closing cash',cf.closingCash,'']].map(x=>Array.isArray(x)?{label:x[0],value:x[1],detail:x[2]}:x))}${statement('Balance sheet · 31 August 2026',[...bs.assets,...bs.liabilities,...bs.equity])}</section>
 <section class="section"><h2>Supporting schedules</h2><div class="grid two">${Object.entries(d.schedules).map(([name,rows])=>`<article class="card"><h3>${name.replace(/([A-Z])/g,' $1').replace(/^./,s=>s.toUpperCase())}</h3>${rowTable(rows)}</article>`).join('')}</div></section>
 <section class="section"><h2>Required financial checks</h2><div class="checks">${d.reconciliations.map(r=>`<div class="check"><strong>✓ ${r.status}</strong><span>${r.name}</span><small>${r.formula}</small></div>`).join('')}</div></section>
 <section class="section"><h2>Uncertainty register</h2>${d.uncertainties.map(u=>`<article class="card uncertainty"><div class="summary-line"><strong>${u.item}</strong>${tag(u.status,'warn')}</div><p>${money(u.amount)} · ${u.treatment}</p></article>`).join('')}</section>`;
}
function review(d){
 const material=d.decisions.filter(x=>x.reviewTier==='material_judgment');
 return `<section class="card"><span class="eyebrow">Compact assessor view</span><h2>AI Review Trail</h2><p class="muted">25 material management-accounting judgments. This view preserves an independent challenge and the final certified position.</p><div class="toolbar"><input id="search" placeholder="Search all 100 decisions by ID, question or answer"><span id="count">100 decisions</span></div><div style="overflow-x:auto"><table><thead><tr><th>ID</th><th>Question</th><th>Certified answer</th><th>Tier</th><th>Confidence</th></tr></thead><tbody id="decisionTable">${d.decisions.map(x=>`<tr class="decision-row" data-search="${(`${x.id} ${x.question} ${x.answer}`).toLowerCase()}"><td>${x.id}</td><td>${x.question}</td><td>${x.answer}</td><td>${x.reviewTier==='material_judgment'?'Material':'Operational'}</td><td>${tag(x.confidence,x.confidence==='low'?'low':'')}</td></tr>`).join('')}</tbody></table></div></section><section id="decisionList"><h2>Material judgment detail</h2>${material.map(x=>decisionCard(x,true)).join('')}</section>`;
}
function decisionCard(x,isMaterial){
 if(!isMaterial) return `<article class="card decision operational" data-search="${(`${x.id} ${x.question} ${x.answer}`).toLowerCase()}"><div class="summary-line"><strong>${x.id} · ${x.question}</strong>${tag(x.confidence)}</div><p>${x.answer}</p><small class="muted">Evidence: ${x.evidence[0]}</small></article>`;
 const diff=x.aiProposal!==x.independentChallenge;
 return `<article class="card review-card ${diff?'disagreement':''} ${x.confidence==='low'?'lowconfidence':''} decision" data-search="${(`${x.id} ${x.question} ${x.answer} ${x.aiProposal} ${x.independentChallenge}`).toLowerCase()}"><div class="summary-line"><strong>${x.id} · ${x.question}</strong><span>${tag(x.confidence,x.confidence==='low'?'low':'')}${diff?tag('Independent challenge','warn'):''}${x.changedFromAI?tag('Student override','warn'):''}</span></div><div class="review-grid"><div><small class="muted">Agent 1 proposal</small><p>${x.aiProposal}</p></div><div><small class="muted">Agent 2 independent challenge</small><p>${x.independentChallenge}</p></div><div><small class="muted">Final certified answer</small><p>${x.answer}</p></div><div><small class="muted">Reasoning and evidence</small><p>${x.studentReasoning}</p><p class="muted">${x.evidence.join(' · ')}</p></div></div><div class="effect"><strong>Statement effect:</strong>${effects(x.statementEffect)}</div></article>`;
}
async function run(){
 const d=window.__SUBMISSION__;
 const reviewMode=location.pathname==='/review'||location.hash==='#review'; document.querySelector('#homeLink').classList.toggle('active',!reviewMode);document.querySelector('#reviewLink').classList.toggle('active',reviewMode);document.querySelector('#app').innerHTML=reviewMode?review(d):dashboard(d);
 if(reviewMode){const input=document.querySelector('#search'), cards=[...document.querySelectorAll('.decision')], rows=[...document.querySelectorAll('.decision-row')],count=document.querySelector('#count');input.addEventListener('input',()=>{let shown=0;const query=input.value.toLowerCase();rows.forEach(r=>{const ok=r.dataset.search.includes(query);r.hidden=!ok;if(ok)shown++});cards.forEach(c=>c.hidden=!c.dataset.search.includes(query));count.textContent=`${shown} decisions shown`;});}
 document.querySelector('#printBtn').onclick=()=>print(); document.querySelector('#submissionLink').onclick=(event)=>{ event.preventDefault(); const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='submission.json'; a.click(); URL.revokeObjectURL(url); }; 
}
addEventListener('hashchange',run); run().catch(()=>{document.querySelector('#app').innerHTML='<div class="card"><h2>Submission data unavailable</h2><p>Run <code>npm run build:data</code> before deployment.</p></div>';});
</script></body></html>
